<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAROL</title>
<style>
  :root { --bg: #f6f4f0; --text: #1d1d1f; --muted: #6e6b66; --accent: #1d7fd8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16171a; --text: #ececee; --muted: #9a9aa2; --accent: #3fa8f0; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 620px; margin: 0 auto; padding: 72px 20px; text-align: center; }
  .orb { width: 96px; height: 96px; margin: 0 auto 24px; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #9af8de 0%, #2fd8ad 24%, #12b3bf 50%, #1f7ae0 80%, #2459d8 100%);
    box-shadow: 0 0 30px 6px rgba(47,216,173,.4); }
  h1 { margin: 0 0 8px; letter-spacing: .04em; }
  p { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="orb" aria-hidden="true"></div>
  <h1>CAROL</h1>
  <p>A private, personal AI assistant. CAROL is used by one person, her owner, and is not offered to the public.</p>
  <p><a href="privacy.html">Privacy policy</a></p>
</main>
</body>
</html>
